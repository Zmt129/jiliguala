<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - Buding</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        /* 表格样式 */
        .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; font-weight: 600; color: #555; }
        tr:hover { background-color: #f1f3f5; }
        
        /* 状态标签 */
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .status-1 { background: #e6fffa; color: #00b894; }
        .status-0 { background: #ffeaa7; color: #d63031; }

        /* 按钮 */
        .btn-sm { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; margin-right: 5px; transition: all 0.2s; }
        .btn-edit { background: #0984e3; color: white; }
        .btn-edit:hover { background: #74b9ff; }
        .btn-delete { background: #ff7675; color: white; }
        .btn-delete:hover { background: #fab1a0; }

        /* 模态框 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; margin: 80px auto; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <h1>Buding 管理系统</h1>
            </div>
            <div class="navbar-user">
                <a href="/dashboard.html" style="color:white; text-decoration:none; margin-right:15px;">控制台</a>
                <span id="username">加载中...</span>
                <button id="logoutBtn" class="logout-btn">退出登录</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="content-container">
            <div class="info-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3>用户列表</h3>
                    <button class="login-btn" style="width: auto; padding: 10px 20px;" onclick="openModal()">+ 新增用户</button>
                </div>
                
                <!-- 搜索栏 -->
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <input type="text" id="searchUsername" placeholder="搜索用户名..." style="padding: 10px; border: 1px solid #ddd; border-radius: 6px; flex: 1;">
                    <button class="login-btn" style="width: auto; padding: 10px 20px;" onclick="fetchUsers()">搜索</button>
                </div>

                <div class="table-container">
                    <table id="userTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>昵称</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 数据将通过 JS 渲染 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- 新增/编辑弹窗 -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">新增用户</h3>
            <form id="userForm" style="margin-top: 20px;">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label>用户名</label>
                    <input id="f_username" required placeholder="请输入用户名">
                </div>
                <div class="form-group" id="pwdGroup">
                    <label>密码</label>
                    <input type="password" id="f_password" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label>昵称</label>
                    <input id="f_nickname" placeholder="请输入昵称">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="f_status">
                        <option value="1">正常</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
                <div style="text-align: right; margin-top: 20px;">
                    <button type="button" onclick="closeModal()" style="padding: 10px 20px; background: #eee; border: none; border-radius: 6px; cursor: pointer; margin-right: 10px;">取消</button>
                    <button type="submit" class="login-btn" style="width: auto; padding: 10px 20px;">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/users.js"></script>
</body>
</html>
